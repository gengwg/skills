name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10
      - run: uv run --script .github/check.py
      - run: python3 hooks/test_guard.py
      - run: python3 hooks/test_mcp_classify.py
        env:
          GH_TOKEN: ${{ github.token }}
      - run: shellcheck hooks/*.sh
